# GRPO on integer arithmetic with Qwen2.5-0.5B-Instruct, sized for a 24 GB Apple
# Silicon laptop.

[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"
dtype = "float32"
gradient_checkpointing = true
device = "auto"

[lora]
rank = 16
alpha = 32.0

[task]
name = "arithmetic"
format_weight = 0.1
eval_size = 200

[rollout]
prompts_per_step = 16
group_size = 8
max_new_tokens = 256
temperature = 1.0
generation_batch_size = 128

[loss]
clip_low = 0.2
clip_high = 0.2
kl_coef = 0.04
aggregation = "token"
scale_advantages = true

[optim]
lr = 2e-5
warmup_steps = 10
epochs_per_batch = 1
minibatches_per_epoch = 2
micro_batch_size = 8
max_grad_norm = 1.0

[train]
steps = 60
eval_every = 10
save_every = 10
output_dir = "runs/arith"
